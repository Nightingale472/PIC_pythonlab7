{% load static %}
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Django Public Blog — создать статью</title>
    <link rel="stylesheet" href="{% static 'css/article.css' %}">
</head>
<body class="create-post">
    <div class="header">
        <img src="{% static 'img/logo.png' %}" alt="Django public blog">
        <a class="all-posts" href="{% url 'archive' %}">Все записи</a>
    </div>

    <div class="content">
        <h1>Написать статью</h1>

        <form method="POST">
            {% csrf_token %}

            <input type="text" name="title" placeholder="Название статьи"
                   value="{{ form.title|default:'' }}">

            <textarea name="text" placeholder="Текст статьи">{{ form.text|default:'' }}</textarea>

            <input type="submit" value="Сохранить">
        </form>

        {% if form.errors %}
            <p class="form-error">{{ form.errors }}</p>
        {% endif %}
    </div>
</body>
</html>
