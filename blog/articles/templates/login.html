{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>Django Public Blog — вход</title>
    <link rel="stylesheet" href="{% static 'css/article.css' %}">
</head>
<body class="auth-page">
    <div class="header">
        <a href="{% url 'archive' %}">
            <img src="{% static 'img/logo.png' %}" alt="Django public blog">
        </a>
        <a class="all-posts" href="{% url 'register' %}">Регистрация</a>
    </div>

    <div class="content">
        <h1>Вход</h1>

        <form method="POST">
            {% csrf_token %}

            <input type="text" name="username" placeholder="Имя пользователя"
                   value="{{ form.username|default:'' }}">

            <input type="password" name="password" placeholder="Пароль">

            <input type="submit" value="Войти">
        </form>

        {% if form.errors %}
            <p class="form-error">{{ form.errors }}</p>
        {% endif %}

        <p class="auth-switch">
            Нет аккаунта? <a href="{% url 'register' %}">Зарегистрироваться</a>
        </p>
    </div>
</body>
</html>
