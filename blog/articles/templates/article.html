{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>{{ post.title }}</title>
    <link rel="stylesheet" href="{% static 'css/article.css' %}">
</head>
<body class="article">

    <div class="header">
    <a href="{% url 'archive' %}">
        <img src="{% static 'img/logo.png' %}" alt="Django public blog">
    </a>

    <div class="header-links">
        <a href="{% url 'archive' %}">Все статьи</a>
        {% if user.is_authenticated %}
            <span class="header-user">{{ user.username }}</span>
            <a href="{% url 'logout' %}">Выйти</a>
        {% else %}
            <a href="{% url 'login' %}">Войти</a>
            <a href="{% url 'register' %}">Регистрация</a>
        {% endif %}
    </div>
</div>

    <div class="content">
        <h1>{{ post.title }}</h1>

        <div class="article-info">
            <div class="article-author">{{ post.author.username }}</div>
            <div class="article-created-date">{{ post.created_date|date:"d E Y" }}</div>
        </div>

        <div class="article-text">
            {{ post.text|linebreaks }}
        </div>
    </div>

</body>
</html>
